
# =========================================================
# SERVER
# =========================================================
server.port=8081


# =========================================================
# DATABASE 1 - MYSQL (EMPLOYEE MANAGEMENT)
# Port: 3306
# Database: employees_db
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/employees_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE - MYSQL
# =========================================================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# DATABASE 2 - MARIADB (VECTOR DATABASE)
# Port: 3308 on host
# Database: springai
#
# IMPORTANT:
# Use this datasource through your custom
# DatabaseConfig.java and VectorStoreConfig.java.
# =========================================================
app.vector.datasource.url=${RAG_MARIADB_URL:jdbc:mariadb://localhost:3308/springai}
app.vector.datasource.username=${RAG_MARIADB_USERNAME:root}
app.vector.datasource.password=${RAG_MARIADB_PASSWORD:root1234}
app.vector.datasource.driver-class-name=org.mariadb.jdbc.Driver


# =========================================================
# SPRING AI - MARIADB VECTOR STORE
# =========================================================
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=1024
spring.ai.vectorstore.mariadb.table-name=employee_vector_store


# =========================================================
# KAFKA
# =========================================================
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=employee-email-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=EmployeeManagementSystem.messaging.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=EmployeeManagementSystem.messaging.kafka.EmployeeEvent


# =========================================================
# GMAIL SMTP
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.upload.dir=${APP_UPLOAD_DIR:uploads/employee-documents}
app.profile-photo.dir=${PROFILE_PHOTO_DIR:uploads/profile-photos}


# =========================================================
# JWT
# =========================================================
# Development fallback only. Set JWT_SECRET in production.
security.jwt.secret=${JWT_SECRET:bluethink-local-development-jwt-secret-change-before-production-2026}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}


# =========================================================
# LOCAL DEVELOPMENT ADMIN BOOTSTRAP
# =========================================================
hrms.bootstrap-admin.enabled=${HRMS_BOOTSTRAP_ADMIN_ENABLED:true}
hrms.bootstrap-admin.user-id=${HRMS_BOOTSTRAP_ADMIN_USER_ID:ADMIN001}
hrms.bootstrap-admin.password=${HRMS_BOOTSTRAP_ADMIN_PASSWORD:admin123}
hrms.bootstrap-admin.name=${HRMS_BOOTSTRAP_ADMIN_NAME:System Administrator}
hrms.bootstrap-admin.email=${HRMS_BOOTSTRAP_ADMIN_EMAIL:admin@bluethink.local}


# =========================================================
# TWILIO SMS
# =========================================================
hrms.sms.twilio.sid=${TWILIO_ACCOUNT_SID:}
hrms.sms.twilio.token=${TWILIO_AUTH_TOKEN:}
hrms.sms.twilio.from=${TWILIO_FROM_NUMBER:}


# =========================================================
# RAG FEATURE
# =========================================================
rag.enabled=${RAG_ENABLED:false}


# =========================================================
# JINA AI - EMBEDDINGS
# =========================================================
rag.jina.api-url=${JINA_API_URL:https://api.jina.ai/v1/embeddings}
rag.jina.api-key=${JINA_API_KEY:}
rag.jina.model=${JINA_EMBEDDING_MODEL:jina-embeddings-v5-omni-small}
rag.jina.dimensions=${JINA_EMBEDDING_DIMENSIONS:1024}
rag.jina.query-task=${JINA_QUERY_TASK:retrieval.query}
rag.jina.document-task=${JINA_DOCUMENT_TASK:retrieval.passage}

# Compatibility aliases for existing custom Jina service.
# Keep these if your Java code uses the jina.* prefix.
jina.api.url=${JINA_API_URL:https://api.jina.ai/v1/embeddings}
jina.api.key=${JINA_API_KEY:}
jina.embedding.model=${JINA_EMBEDDING_MODEL:jina-embeddings-v5-omni-small}
jina.embedding.dimensions=${JINA_EMBEDDING_DIMENSIONS:1024}
jina.embedding.query-task=${JINA_QUERY_TASK:retrieval.query}
jina.embedding.document-task=${JINA_DOCUMENT_TASK:retrieval.passage}


# =========================================================
# GROQ AI - OPENAI-COMPATIBLE CHAT API
# =========================================================
spring.ai.openai.chat.base-url=${GROQ_API_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=0.2

# Disable OpenAI embeddings because Jina is the embedding provider.
# Custom Jina implementation must provide its own EmbeddingModel
# if Spring AI VectorStore requires one.
spring.ai.model.embedding=none

# Disable unused models
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none


# =========================================================
# LEAVE POLICY DOCUMENT
# =========================================================
app.documents.leave-policy=${LEAVE_POLICY_PDF:classpath:670LEAVE POLICY New.pdf}


# =========================================================
# FRONTEND URL AND CORS
# =========================================================
portal.frontend-url=${PORTAL_FRONTEND_URL:http://localhost:5173}
portal.cors.allowed-origins=${PORTAL_CORS_ALLOWED_ORIGINS:${PORTAL_FRONTEND_URL:http://localhost:5173}}


# =========================================================
# ATTENDANCE POLICY
# =========================================================
attendance.office-start=${ATTENDANCE_OFFICE_START:10:00}
attendance.grace-minutes=${ATTENDANCE_GRACE_MINUTES:15}


# =========================================================
# EXCEPTION HANDLING
# =========================================================
spring.mvc.throw-exception-if-no-handler-found=true


# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.ai=INFO
logging.level.com.example.employeeai=DEBUG
