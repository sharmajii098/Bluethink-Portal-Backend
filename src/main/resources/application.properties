# =========================================================
# SERVER
# =========================================================
server.port=8081


# =========================================================
# DATABASE - MYSQL
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employees_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# KAFKA
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=employee-email-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=EmployeeManagementSystem.messaging.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=EmployeeManagementSystem.messaging.kafka.EmployeeEvent


# =========================================================
# GMAIL SMTP
# =========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.upload.dir=${APP_UPLOAD_DIR:uploads/employee-documents}


# =========================================================
# =========================================================


# =========================================================
# EXCEPTION HANDLING
# =========================================================
spring.mvc.throw-exception-if-no-handler-found=true


# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.apache.kafka=INFO


# =========================================================
# JWT
# =========================================================
# Supply JWT_SECRET privately. The local launcher can create a stable development secret.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}


# =========================================================
# LOCAL DEVELOPMENT ADMIN BOOTSTRAP
# =========================================================
hrms.bootstrap-admin.enabled=${HRMS_BOOTSTRAP_ADMIN_ENABLED:false}
hrms.bootstrap-admin.user-id=${HRMS_BOOTSTRAP_ADMIN_USER_ID:ADMIN001}
hrms.bootstrap-admin.password=${HRMS_BOOTSTRAP_ADMIN_PASSWORD:}
hrms.bootstrap-admin.name=${HRMS_BOOTSTRAP_ADMIN_NAME:System Administrator}
hrms.bootstrap-admin.email=${HRMS_BOOTSTRAP_ADMIN_EMAIL:admin@bluethink.local}
# Profile image storage
app.profile-photo.dir=${PROFILE_PHOTO_DIR:uploads/profile-photos}

# Optional Twilio SMS credentials. Without these, account emails still work.
hrms.sms.twilio.sid=${TWILIO_ACCOUNT_SID:}
hrms.sms.twilio.token=${TWILIO_AUTH_TOKEN:}
hrms.sms.twilio.from=${TWILIO_FROM_NUMBER:}

# Public frontend URL used in expiring activation emails (no secrets here).
portal.frontend-url=${PORTAL_FRONTEND_URL:http://localhost:5173}

# Adjust to your company attendance policy. Cutoff = office start + grace minutes.
attendance.office-start=${ATTENDANCE_OFFICE_START:10:00}
attendance.grace-minutes=${ATTENDANCE_GRACE_MINUTES:15}



# Process-local cap on concurrent inference calls; independent of portal DB lookups.
hrms.ai.max-concurrent-model-calls=${HRMS_AI_MAX_CONCURRENT_MODEL_CALLS:3}
hrms.ai.circuit-failure-threshold=${HRMS_AI_CIRCUIT_FAILURE_THRESHOLD:3}
hrms.ai.circuit-reset-seconds=${HRMS_AI_CIRCUIT_RESET_SECONDS:30}

# Consolidated collaboration/payroll/letter release (no provider secrets in source).
bluethink.business-zone=${BLUETHINK_BUSINESS_ZONE:Asia/Kolkata}
bluethink.chat.redis-enabled=${BLUETHINK_CHAT_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
chat.antivirus.required=${CHAT_ANTIVIRUS_REQUIRED:true}
chat.antivirus.host=${CHAT_ANTIVIRUS_HOST:127.0.0.1}
chat.antivirus.port=${CHAT_ANTIVIRUS_PORT:3310}
chat.attachments.dir=${CHAT_ATTACHMENTS_DIR:uploads/chat}
bluethink.meetings.email.enabled=${BLUETHINK_MEETINGS_EMAIL_ENABLED:false}
bluethink.meetings.email.from=${BLUETHINK_MEETINGS_EMAIL_FROM:}
bluethink.meetings.external-recipient-domains=${BLUETHINK_MEETINGS_EXTERNAL_RECIPIENT_DOMAINS:}
bluethink.meetings.reminders.poll-ms=${BLUETHINK_MEETINGS_POLL_MS:60000}
bluethink.calendar.encryption-key=${BLUETHINK_CALENDAR_ENCRYPTION_KEY:}
bluethink.calendar.google.enabled=${BLUETHINK_GOOGLE_CALENDAR_ENABLED:false}
bluethink.calendar.google.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
bluethink.calendar.google.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
bluethink.calendar.google.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:}
bluethink.calendar.microsoft.enabled=${BLUETHINK_MICROSOFT_CALENDAR_ENABLED:false}
bluethink.calendar.microsoft.client-id=${MICROSOFT_CALENDAR_CLIENT_ID:}
bluethink.calendar.microsoft.client-secret=${MICROSOFT_CALENDAR_CLIENT_SECRET:}
bluethink.calendar.microsoft.redirect-uri=${MICROSOFT_CALENDAR_REDIRECT_URI:}
bluethink.calendar.microsoft.tenant=${MICROSOFT_CALENDAR_TENANT:organizations}
bluethink.calendar.sync.poll-ms=${BLUETHINK_CALENDAR_SYNC_POLL_MS:60000}
server.error.include-message=never
server.error.include-stacktrace=never

attendance.timezone=${ATTENDANCE_TIMEZONE:Asia/Kolkata}

# AI chat history is retained only for a bounded period.
bluethink.ai.history.retention-days=${BLUETHINK_AI_HISTORY_RETENTION_DAYS:90}

# V26: external AI is disabled until explicitly approved by the company.
bluethink.ai.provider=${BLUETHINK_AI_PROVIDER:groq}
bluethink.ai.external-data-approved=${BLUETHINK_AI_EXTERNAL_DATA_APPROVED:false}
bluethink.ai.groq-key=${GROQ_API_KEY:}
bluethink.ai.groq-model=${GROQ_MODEL:llama-3.3-70b-versatile}
bluethink.ai.knowledge-enabled=${BLUETHINK_AI_KNOWLEDGE_ENABLED:false}
bluethink.ai.vector-store=${BLUETHINK_AI_VECTOR_STORE:mysql}
bluethink.ai.qdrant.url=${QDRANT_URL:http://127.0.0.1:6333}
bluethink.ai.qdrant.collection=${QDRANT_COLLECTION:bluethink_knowledge_v1}
bluethink.ai.qdrant.api-key=${QDRANT_API_KEY:}

bluethink.ai.jina-key=${JINA_API_KEY:}
bluethink.ai.jina-model=${JINA_MODEL:jina-embeddings-v3}

bluethink.ai.cloud-timeout-seconds=${BLUETHINK_AI_CLOUD_TIMEOUT_SECONDS:35}
# Optional separate Groq deadline; Jina continues to use cloud-timeout-seconds.
bluethink.ai.groq-timeout-seconds=${BLUETHINK_AI_GROQ_TIMEOUT_SECONDS:${BLUETHINK_AI_CLOUD_TIMEOUT_SECONDS:35}}

# Interactive inference: a warm model, bounded output, no automatic multi-minute retries.
bluethink.ai.max-output-tokens=${HRMS_AI_MAX_OUTPUT_TOKENS:360}
