# =========================================================
# PRODUCTION PROFILE
# Supply all secrets/connection details through environment variables.
# =========================================================
spring.config.activate.on-profile=prod

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/employee-documents}

logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.apache.kafka=INFO

hrms.bootstrap-admin.enabled=${HRMS_BOOTSTRAP_ADMIN_ENABLED:false}

# Profile image storage
app.profile-photo.dir=${PROFILE_PHOTO_DIR:uploads/profile-photos}

# Optional Twilio SMS credentials. Without these, account emails still work.
hrms.sms.twilio.sid=${TWILIO_ACCOUNT_SID:}
hrms.sms.twilio.token=${TWILIO_AUTH_TOKEN:}
hrms.sms.twilio.from=${TWILIO_FROM_NUMBER:}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=true

# Privacy: automatic disposal of AI chat history (1-365 days).
bluethink.ai.history.retention-days=${BLUETHINK_AI_HISTORY_RETENTION_DAYS:90}

# V26: external AI is disabled until explicitly approved by the company.
bluethink.ai.provider=${BLUETHINK_AI_PROVIDER:groq}
bluethink.ai.external-data-approved=${BLUETHINK_AI_EXTERNAL_DATA_APPROVED:false}
bluethink.ai.groq-key=${GROQ_API_KEY:}
bluethink.ai.groq-model=${GROQ_MODEL:llama-3.3-70b-versatile}
bluethink.ai.knowledge-enabled=${BLUETHINK_AI_KNOWLEDGE_ENABLED:false}
bluethink.ai.vector-store=${BLUETHINK_AI_VECTOR_STORE:mysql}
bluethink.ai.qdrant.url=${QDRANT_URL:http://127.0.0.1:6333}
bluethink.ai.qdrant.collection=${QDRANT_COLLECTION:bluethink_knowledge_v1}
bluethink.ai.qdrant.api-key=${QDRANT_API_KEY:}

bluethink.ai.jina-key=${JINA_API_KEY:}
bluethink.ai.jina-model=${JINA_MODEL:jina-embeddings-v3}

bluethink.ai.cloud-timeout-seconds=${BLUETHINK_AI_CLOUD_TIMEOUT_SECONDS:35}
# Optional separate Groq deadline; Jina continues to use cloud-timeout-seconds.
bluethink.ai.groq-timeout-seconds=${BLUETHINK_AI_GROQ_TIMEOUT_SECONDS:${BLUETHINK_AI_CLOUD_TIMEOUT_SECONDS:35}}

# Bound resource use and drain in-flight requests during a rolling restart.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.threads.max=${HTTP_MAX_THREADS:100}
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=1500000
