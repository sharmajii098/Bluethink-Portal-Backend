# Run only as a one-off container without published ports against an initialized database.
spring.config.activate.on-profile=bootstrap
server.port=0
spring.jpa.hibernate.ddl-auto=validate
hrms.bootstrap-admin.enabled=true
hrms.bootstrap-admin.user-id=${HRMS_BOOTSTRAP_ADMIN_USER_ID}
hrms.bootstrap-admin.password=${HRMS_BOOTSTRAP_ADMIN_PASSWORD}
hrms.bootstrap-admin.name=${HRMS_BOOTSTRAP_ADMIN_NAME:Portal Administrator}
hrms.bootstrap-admin.email=${HRMS_BOOTSTRAP_ADMIN_EMAIL}
